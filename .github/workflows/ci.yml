name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here runs third-party code (npm install trees, Go modules, a Docker
# build) on the runner and writes nothing back to the repo. Without this block
# GITHUB_TOKEN inherits whatever the repo/org default is, which is usually
# read/write.
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:6c538e7206ea40ff740ef27883529390a690b6ead6ba96b44c67a9f7c638e8fd
        env:
          POSTGRES_DB: homefinance_test
          POSTGRES_USER: homefinance
          POSTGRES_PASSWORD: homefinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://homefinance:homefinance@localhost:5432/homefinance_test?sslmode=disable
    steps:
      # Every `uses:` in this repo is pinned to a full commit SHA: a tag is
      # mutable, so whoever controls the action's repo can repoint v7 and every
      # later run executes unreviewed code. Renovate keeps the SHAs (and the
      # trailing version comments) current via helpers:pinGitHubActionDigests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Explicit, and deliberately NOT go-version-file: backend/go.mod says
          # `go 1.26.0` with no toolchain directive, while the Dockerfile builds
          # production with golang:1.27-alpine — CI was validating against a
          # different, older toolchain than the one that ships. Keep this in
          # step with the Dockerfile's golang tag.
          go-version: '1.27'
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: cd backend && go vet ./...

      # Fails while go.sum still carries stale entries from successive Renovate
      # bumps — run `go mod tidy` in backend/ to clear it.
      - name: go mod tidy check
        run: cd backend && go mod tidy -diff

      - name: Unit tests
        run: cd backend && go test ./...

      # The integration-tagged tests need real schema — previously a no-op
      # since no integration tests existed yet, so this gap was invisible.
      - name: Run migrations
        run: cd backend && go run ./cmd/server --migrate-only

      - name: Integration tests
        run: cd backend && go test -tags integration ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # frontend/.npmrc sets ignore-scripts=true, so no dependency's
      # install hook runs on the runner.
      - name: Install
        run: cd frontend && npm ci

      # Via npm scripts, not `npx tsc`: from a cwd whose node_modules is
      # missing, npx silently installs an unrelated `tsc` package and reports a
      # false clean. The script resolves the local binary. It runs `tsc -b`,
      # which is what actually covers vite.config.ts.
      - name: Type check
        run: cd frontend && npm run typecheck

      - name: Unit tests
        run: cd frontend && npm test -- --run

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t home-finance:ci .

      # Report-only pass: surfaces HIGH findings in the log without blocking.
      - name: Scan image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-finance:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

      # Blocking pass. The base is distroless-static and the binaries are
      # statically linked Go, so a fixable CRITICAL here is real and should stop
      # the merge. release.yml runs the same gate against the multi-arch image
      # that actually gets pushed.
      - name: Fail on fixable CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-finance:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
