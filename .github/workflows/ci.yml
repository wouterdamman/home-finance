name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: homefinance_test
          POSTGRES_USER: homefinance
          POSTGRES_PASSWORD: homefinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://homefinance:homefinance@localhost:5432/homefinance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: cd backend && go vet ./...

      - name: Unit tests
        run: cd backend && go test ./...

      # The integration-tagged tests need real schema — previously a no-op
      # since no integration tests existed yet, so this gap was invisible.
      - name: Run migrations
        run: cd backend && go run ./cmd/server --migrate-only

      - name: Integration tests
        run: cd backend && go test -tags integration ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: Type check
        run: cd frontend && npx tsc --noEmit

      - name: Unit tests
        run: cd frontend && npx vitest run

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t home-finance:ci .

      # Report-only for now (exit-code 0): surfaces CVEs in the Actions log
      # without blocking merges. Flip exit-code to 1 once findings are
      # triaged and you want new HIGH/CRITICAL CVEs to fail CI.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: home-finance:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table
