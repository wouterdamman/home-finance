services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homefinance
      POSTGRES_PASSWORD: homefinance
      POSTGRES_DB: homefinance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefinance"]
      interval: 5s
      timeout: 3s
      retries: 10

  dex:
    image: dexidp/dex:v2.41.0
    command: dex serve /etc/dex/config.yaml
    ports:
      - "5556:5556"
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://homefinance:homefinance@db:5432/homefinance?sslmode=disable
      OIDC_ISSUER_URL: http://dex:5556/dex
      OIDC_CLIENT_ID: home-finance
      OIDC_CLIENT_SECRET: dev-secret
      OIDC_REDIRECT_URL: http://localhost:8080/auth/callback
      SESSION_KEY: dev-session-key-change-in-production-32chars
      ENV: production
      AUTO_MIGRATE: "true"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
      dex:
        condition: service_started

volumes:
  pgdata:
