image:
  repository: ghcr.io/wouterdamman/home-finance
  tag: 1.0.1
  pullPolicy: IfNotPresent

replicaCount: 1

env:
  ENV: production
  # Migrations run via the pre-install/pre-upgrade Job (migrate-job.yaml),
  # not on every pod startup — avoids concurrent goose runs when
  # replicaCount > 1 and gives migrations a clear pass/fail before rollout.
  AUTO_MIGRATE: "false"
  PORT: "8080"

oidc:
  issuerURL: ""
  clientID: ""
  redirectURL: ""
  existingSecret: ""
  clientSecretKey: clientSecret

ingress:
  enabled: true
  className: nginx
  host: finance.example.com
  tls:
    enabled: true
    secretName: home-finance-tls

postgres:
  clusterName: home-finance-pg
  instances: 1
  storageSize: 5Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  databaseName: homefinance
  ownerName: homefinance
  # Scheduled backups via CNPG barmanObjectStore. Disabled by default — fill
  # in an S3-compatible bucket + credentials secret to enable. Without this,
  # a lost PVC means the family's financial data is unrecoverable.
  backup:
    enabled: false
    schedule: "0 0 3 * * *" # daily at 03:00
    retentionPolicy: "30d"
    destinationPath: "s3://CHANGEME-bucket/home-finance-pg"
    endpointURL: ""
    existingSecret: "" # must provide ACCESS_KEY_ID / ACCESS_SECRET_KEY keys
