image:
  repository: ghcr.io/wouterdamman/home-finance
  tag: 1.18.2 # x-release-please-version
  pullPolicy: IfNotPresent

# Only needed if the image repository above is private. List of Secret
# names (type kubernetes.io/dockerconfigjson) already present in the
# release namespace, e.g. [{name: ghcr-pull-secret}].
imagePullSecrets: []

replicaCount: 1

# --- ServiceAccount ----------------------------------------------------------
# The app makes zero Kubernetes API calls, so it gets its own ServiceAccount
# with no RoleBindings and no token mounted. Using `default` instead would hand
# an internet-facing process a live cluster credential, and would silently
# inherit any future ClusterRoleBinding aimed at system:authenticated.
serviceAccount:
  create: true
  # Leave empty to use "<release name>". Set a name (with create: false) to
  # reuse a ServiceAccount you manage elsewhere.
  name: ""
  annotations: {}
  # Neither the server nor the migrate Job talks to the API server. Only flip
  # this if you add something that genuinely needs a token.
  automountToken: false

# --- Pod / container hardening ----------------------------------------------
# These values satisfy the Pod Security "restricted" profile that
# templates/namespace.yaml enforces, and apply to both the Deployment and the
# migrate Job. The image is distroless-static running as numeric UID 65532, so
# runAsNonRoot/runAsUser mostly restate what the base image already does — the
# point is that the kubelet now *checks* it, so a base-image tag change that
# starts shipping root fails the pod instead of silently running as root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  # Without this the container runs seccomp Unconfined under containerd — the
  # full syscall surface is reachable from any app-level RCE.
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# readOnlyRootFilesystem above leaves the app no writable path at all, and it
# needs one: xlsx import writes os.CreateTemp("", "import-*.xlsx"), and both
# xlsx import and avatar upload spill ParseMultipartForm to os.TempDir() once
# the body exceeds the in-memory threshold. An emptyDir at /tmp covers both;
# sizeLimit keeps a runaway upload from filling the node's disk.
tmpVolume:
  sizeLimit: 256Mi

# --- Migration Job -----------------------------------------------------------
# Runs `--migrate-only` as a pre-install/pre-upgrade hook (ArgoCD PreSync), so
# a failed migration fails the sync before the new Deployment is applied.
migrateJob:
  # A migration blocked on a Postgres lock would otherwise hang forever, and
  # because this is a PreSync hook the whole ArgoCD sync hangs with it.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

env:
  ENV: production
  # Migrations run via the pre-install/pre-upgrade Job (migrate-job.yaml),
  # not on every pod startup — avoids concurrent goose runs when
  # replicaCount > 1 and gives migrations a clear pass/fail before rollout.
  AUTO_MIGRATE: "false"
  PORT: "8080"
  # ALLOWED_EMAILS: ""                  # comma-separated allowlist, empty = anyone the IdP authenticates
  # INITIAL_ADMIN_EMAILS: "you@example.com"  # comma-separated, granted role=admin on first login

# Name of the Secret the app reads DATABASE_URL / OIDC_CLIENT_SECRET from at
# runtime. Populated either by externalSecrets.enabled (default) or by you
# creating it by hand (classic mode) — deployment.yaml doesn't care which.
secrets:
  name: home-finance-secrets

namespace:
  # Render templates/namespace.yaml. Turn off if your GitOps tooling already
  # creates/owns the namespace (e.g. ArgoCD `CreateNamespace=true` with no
  # local Namespace manifest, or a parent chart).
  manage: true

# Extra labels merged onto the managed namespace, e.g. Gateway API's
# namespace-referenceGrant-style opt-in labels. Empty by default.
namespaceLabels: {}

oidc:
  issuerURL: ""
  clientID: ""
  redirectURL: ""
  # Only used when externalSecrets.enabled is false — point at a Secret you
  # created yourself containing the OIDC client secret.
  existingSecret: ""
  clientSecretKey: clientSecret

# --- Ingress: classic Kubernetes Ingress ------------------------------------
# Off by default in favor of httproutes (Gateway API) below. Flip this to
# true and clear httproutes to run without Gateway API.
ingress:
  enabled: false
  className: nginx
  host: finance.example.com
  tls:
    enabled: true
    secretName: home-finance-tls

# --- Gateway API HTTPRoute(s) — default routing mechanism ------------------
# List of routes to create. Set to [] and enable `ingress` above to use
# classic Ingress instead. Override `hostname` and `gateway.*` for your
# cluster; these are placeholder/example values.
httproutes:
  - enabled: true
    name: home-finance
    hostname: finance.example.com
    path: /
    gateway:
      name: app-gateway
      namespace: kube-system
      sectionName: app-https-listener
    backend:
      name: home-finance
      port: 80
    # Companion route on the same Gateway's plaintext listener that 301s every
    # request to https://. Off by default because the HTTP listener's
    # sectionName is cluster-specific — set it and flip enabled to get what
    # classic-Ingress mode already gets from nginx's force-ssl-redirect.
    httpRedirect:
      enabled: false
      # Defaults to "<route name>-http-redirect".
      name: ""
      sectionName: app-http-listener
      statusCode: 301

# --- Cilium network policy --------------------------------------------------
# On by default (this stack runs Cilium): a default-deny-friendly policy —
# DNS egress, app-port ingress, and Prometheus scrape ingress, plus escape
# hatches below. Set to false on a cluster without Cilium.
#
# DB and OIDC egress are handled automatically wherever the chart can derive
# them: DB egress when postgres.cnpg.enabled=true (bundled Cluster, same
# namespace, name known) and OIDC egress from oidc.issuerURL (via toFQDNs).
# The only case requiring manual input is postgres.cnpg.enabled=false — an
# external/shared Postgres whose location the chart can't know — fill in
# dbEgress below then.
networkPolicy:
  cilium:
    enabled: true
    prometheusNamespace: monitoring
    # Who may reach the app on :8080. This used to be `fromEntities: [cluster]`,
    # i.e. every managed endpoint plus host/remote-node/unmanaged — any pod in
    # the cluster could hit the app directly and bypass the Gateway (TLS, rate
    # limiting, IP allowlisting, request logging). Same shape as dbEgress
    # below: point it at the Gateway's data plane, or at the nginx controller
    # when running classic-Ingress mode.
    #
    # REQUIRED when networkPolicy.cilium.enabled=true — with namespaceLabel
    # empty no ingress rule is rendered and only Prometheus can reach the app.
    # Defaults match the placeholder httproutes[0].gateway above (Cilium labels
    # a Gateway's pods io.cilium.gateway/owning-gateway: <gateway name>).
    # CHECK THIS AGAINST YOUR CLUSTER BEFORE ROLLING OUT — if these labels miss
    # the real Gateway pods the app simply stops being reachable:
    #   kubectl get pods -n <gateway namespace> --show-labels
    # Narrows :8080 ingress to the Gateway's own pods. Left empty by default
    # because the correct labels differ per cluster and a wrong selector makes
    # the app unreachable rather than merely unhardened. Confirm with
    # `kubectl get pods -n <gateway ns> --show-labels`, then set both fields —
    # until then the policy falls back to allowing any in-cluster endpoint.
    gatewayIngress:
      # This cluster runs Cilium's Gateway API as a shared node-local Envoy
      # DaemonSet (no per-Gateway pod, no io.cilium.gateway/owning-gateway
      # label present) — confirmed via `kubectl get pods -n kube-system -l
      # k8s-app=cilium-envoy -o jsonpath='{.items[0].metadata.labels}'`.
      namespaceLabel: "kube-system"
      podLabels:
        k8s-app: cilium-envoy
      port: 8080
    # REQUIRED when postgres.cnpg.enabled=false (external DB) and
    # networkPolicy.cilium.enabled=true — otherwise the app can't reach it.
    dbEgress:
      namespaceLabel: ""
      podLabels: {}
      port: 5432
    extraEgress: []
    extraIngress: []

# --- Database ----------------------------------------------------------------
# CNPG mode: cnpg.enabled false (default) means DATABASE_URL is expected to
# come from the `secrets.name` Secret (see externalSecrets/oidc above) —
# point it at any Postgres, including a shared/external CNPG cluster you
# already run. Set cnpg.enabled true to have this chart provision its own
# dedicated CNPG Cluster (classic/portable mode, no external DB required).
postgres:
  # sslmode appended to the DATABASE_URL that externalsecret.yaml assembles.
  # `require` (not `disable`) because prod talks to the shared CNPG cluster in
  # another namespace — every query and result set, the whole ledger plus the
  # sessions table backing authentication, crosses the pod network. CNPG serves
  # TLS out of the box. Use verify-full with a CA bundle if you want the server
  # identity checked too; `disable` only if your Postgres has no TLS at all.
  sslMode: require
  cnpg:
    enabled: false
    clusterName: home-finance-pg
    instances: 1
    storageSize: 5Gi
    imageName: ghcr.io/cloudnative-pg/postgresql:16
    databaseName: homefinance
    ownerName: homefinance
    # Scheduled backups via CNPG barmanObjectStore. Disabled by default — fill
    # in an S3-compatible bucket + credentials secret to enable. Without this,
    # a lost PVC means the family's financial data is unrecoverable. Only
    # relevant when cnpg.enabled is true.
    backup:
      enabled: false
      schedule: "0 0 3 * * *" # daily at 03:00
      retentionPolicy: "30d"
      destinationPath: "s3://CHANGEME-bucket/home-finance-pg"
      endpointURL: ""
      existingSecret: "" # must provide ACCESS_KEY_ID / ACCESS_SECRET_KEY keys

# --- External Secrets Operator ----------------------------------------------
# On by default: renders an ExternalSecret that builds the `secrets.name`
# Secret (DATABASE_URL + OIDC_CLIENT_SECRET) from a SecretStore. Turn off
# and hand-create the `secrets.name` Secret yourself for classic mode
# (no ESO required) — see keys expected below.
externalSecrets:
  enabled: true
  secretStoreRef: onepassword-connect
  secretStoreKind: ClusterSecretStore
  database:
    # Remote item must expose properties: host, port, database, username, password
    remoteKey: cnpg-shared-home-finance
  oidc:
    # Remote item must expose property: client_secret
    remoteKey: home-finance-oidc

# Classic-mode reference: if externalSecrets.enabled is false, create
# `secrets.name` yourself with:
#   kubectl create secret generic home-finance-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/db?sslmode=require' \
#     --from-literal=OIDC_CLIENT_SECRET='...'

# Application-level S3-compatible object storage — separate from postgres.backup
# above (different concern: app data, not DB backups). Used for periodic audit-log
# export when auditExport.interval is set. Disabled by default; that feature
# degrades gracefully (export loop never starts) when this is off. (Avatar photos
# are stored as bytea rows in Postgres — no object storage involved.)
s3:
  enabled: false
  bucket: ""
  region: ""
  useSSL: true
  # Secret must provide all three keys below — endpoint included, so the
  # object storage location itself isn't sitting in plain values.yaml.
  existingSecret: ""
  endpointKey: ENDPOINT
  accessKeyIdKey: ACCESS_KEY_ID
  secretAccessKeyKey: SECRET_ACCESS_KEY

auditExport:
  # Go duration string, e.g. "10s", "5m", "1h", "12h". Empty disables the
  # background exporter — requires s3.enabled too. Runs inside the server
  # pod (not a separate CronJob), so sub-minute intervals work fine.
  interval: ""
