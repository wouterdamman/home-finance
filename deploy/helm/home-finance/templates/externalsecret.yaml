{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Must exist before migrate-job's pre-install/pre-upgrade hook runs, so
    # give it an earlier hook weight and let ESO race the Job's pod start —
    # kubelet retries CreateContainerConfigError once the Secret key appears.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.secrets.name }}
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://{{ `{{ .dbUsername }}` }}:{{ `{{ .dbPassword }}` }}@{{ `{{ .dbHost }}` }}:{{ `{{ .dbPort }}` }}/{{ `{{ .dbName }}` }}?sslmode=disable'
        OIDC_CLIENT_SECRET: '{{ `{{ .oidcClientSecret }}` }}'
  data:
    - secretKey: dbHost
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: host
    - secretKey: dbPort
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: port
    - secretKey: dbName
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: database
    - secretKey: dbUsername
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: password
    - secretKey: oidcClientSecret
      remoteRef:
        key: {{ .Values.externalSecrets.oidc.remoteKey }}
        property: client_secret
{{- end }}
