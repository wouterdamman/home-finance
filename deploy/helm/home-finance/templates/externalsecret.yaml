{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Must exist before migrate-job's pre-install/pre-upgrade hook runs, so
    # give it an earlier hook weight and let ESO race the Job's pod start —
    # kubelet retries CreateContainerConfigError once the Secret key appears.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ .Values.secrets.name }}
    # No hook-delete-policy is set above, so Helm's before-hook-creation
    # default deletes this ExternalSecret before every upgrade's hook run.
    # creationPolicy Orphan keeps the target Secret un-owned so that
    # deletion doesn't cascade (K8s garbage-collects Owner-created Secrets
    # when their owning ExternalSecret is deleted) — DATABASE_URL/
    # OIDC_CLIENT_SECRET would otherwise vanish for a few seconds on every
    # upgrade until ESO recreates it.
    creationPolicy: Orphan
    template:
      engineVersion: v2
      data:
        # sslmode comes from postgres.sslMode (default `require`), not a
        # hardcoded `disable`: in the default setup this URL points at the
        # shared CNPG cluster in *another namespace*, so every query and result
        # set — the whole ledger, plus the sessions table backing auth —
        # crosses the pod network. CNPG serves TLS out of the box.
        # The {{ `{{ ... }}` }} escapes below are ESO's own templating, left
        # untouched for ESO to resolve at fetch time; only the sslmode value is
        # rendered by Helm.
        DATABASE_URL: 'postgres://{{ `{{ .dbUsername }}` }}:{{ `{{ .dbPassword }}` }}@{{ `{{ .dbHost }}` }}:{{ `{{ .dbPort }}` }}/{{ `{{ .dbName }}` }}?sslmode={{ .Values.postgres.sslMode | default "require" }}'
        OIDC_CLIENT_SECRET: '{{ `{{ .oidcClientSecret }}` }}'
  data:
    - secretKey: dbHost
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: host
    - secretKey: dbPort
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: port
    - secretKey: dbName
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: database
    - secretKey: dbUsername
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.externalSecrets.database.remoteKey }}
        property: password
    - secretKey: oidcClientSecret
      remoteRef:
        key: {{ .Values.externalSecrets.oidc.remoteKey }}
        property: client_secret
{{- end }}
