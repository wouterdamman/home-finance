{{- if .Values.serviceAccount.create }}
{{- $name := .Values.serviceAccount.name | default .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role/ClusterRole is bound to this account anywhere in the chart and no
# token is mounted: the app makes zero Kubernetes API calls. Belt and braces
# with the pod-level automountServiceAccountToken, so a pod spec that forgets
# to set it still gets no credential.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
---
# Separate account for the migrate Job, and the one place in this chart where a
# second SA is worth the duplication: the Job is an ArgoCD PreSync hook, so it
# runs *before* any regular (Sync-phase) resource is applied — pointing it at
# the account above would deadlock the very first sync after this change, since
# pod admission rejects a serviceAccountName that doesn't exist yet and PreSync
# never finishes to create it. This one is therefore a PreSync hook itself, at
# the same weight as the ExternalSecret so it lands before the Job (weight 0).
# That's allowed here precisely because nothing long-lived references it — it is
# genuinely disposable per sync, unlike the account above (see AGENTS.md on why
# helm.sh/hook must never touch a resource that has to survive a sync).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
