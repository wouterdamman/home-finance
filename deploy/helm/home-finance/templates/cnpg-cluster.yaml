{{- if .Values.postgres.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.cnpg.clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-pg
spec:
  instances: {{ .Values.postgres.cnpg.instances }}
  imageName: {{ .Values.postgres.cnpg.imageName }}
  storage:
    size: {{ .Values.postgres.cnpg.storageSize }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.cnpg.databaseName }}
      owner: {{ .Values.postgres.cnpg.ownerName }}
{{- if .Values.postgres.cnpg.backup.enabled }}
  backup:
    retentionPolicy: {{ .Values.postgres.cnpg.backup.retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.postgres.cnpg.backup.destinationPath | quote }}
      {{- if .Values.postgres.cnpg.backup.endpointURL }}
      endpointURL: {{ .Values.postgres.cnpg.backup.endpointURL | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.postgres.cnpg.backup.existingSecret }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .Values.postgres.cnpg.backup.existingSecret }}
          key: ACCESS_SECRET_KEY
{{- end }}
{{- end }}
