apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-pg
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    size: {{ .Values.postgres.storageSize }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.databaseName }}
      owner: {{ .Values.postgres.ownerName }}
