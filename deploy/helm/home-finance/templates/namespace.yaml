{{- if .Values.namespace.manage }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # Deliberately NOT a helm.sh/hook. This app is deployed via ArgoCD, which
    # applies Helm charts through `helm template` + its own sync engine, not
    # `helm install`/`helm upgrade` — it has no install-vs-upgrade concept,
    # so a "pre-install only" hook (the previous approach here) still runs as
    # an ArgoCD PreSync hook on *every* sync. ArgoCD's hook lifecycle deletes
    # and recreates hook resources each time (confirmed via
    # argocd-application-controller logs: "waiting for deletion of hook
    # /Namespace/home-finance" on every sync, even ones with no real changes)
    # — for a Namespace that cascades to delete everything inside it,
    # including PVCs, wiping avatar storage on every single deploy. Use
    # ArgoCD's own sync-wave ordering instead: it orders resource application
    # without any delete+recreate semantics, so the Namespace (and anything
    # inside it) survives normal syncs.
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    # restricted (was baseline): every pod this chart ships now sets
    # runAsNonRoot + runAsUser 65532, seccompProfile RuntimeDefault,
    # allowPrivilegeEscalation false and capabilities drop ALL, and mounts only
    # an emptyDir — the full restricted checklist. Anything added to this
    # namespace later must clear the same bar or the API server rejects it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    {{- with .Values.namespaceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
