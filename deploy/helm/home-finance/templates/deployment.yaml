{{- $saName := .Values.serviceAccount.name | default .Release.Name }}
{{- if not .Values.serviceAccount.create }}
{{- $saName = .Values.serviceAccount.name | default "default" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $saName }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # Required by securityContext.readOnlyRootFilesystem — see tmpVolume
        # in values.yaml for what actually writes here.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            # Free-form env FIRST, on purpose: Kubernetes keeps the *last*
            # duplicate, so rendering this after the secretKeyRef entries below
            # would let `--set env.DATABASE_URL=...` silently replace a Secret
            # reference with a plaintext literal baked into the Deployment spec
            # (and, in this GitOps setup, committed to git). Ordering alone
            # would make that a confusing no-op, so the reserved keys are a hard
            # failure instead.
            {{- $reserved := list "DATABASE_URL" "OIDC_CLIENT_SECRET" "S3_ACCESS_KEY_ID" "S3_SECRET_ACCESS_KEY" }}
            {{- range $key, $val := .Values.env }}
            {{- if has $key $reserved }}
            {{- fail (printf "env.%s is secret-backed and must not be set through .Values.env — put it in the %s Secret (or the s3/oidc existingSecret) instead" $key $.Values.secrets.name) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if and .Values.postgres.cnpg.enabled (not .Values.externalSecrets.enabled) }}
                  name: {{ .Values.postgres.cnpg.clusterName }}-app
                  key: uri
                  {{- else }}
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
                  {{- end }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientID | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectURL | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if .Values.externalSecrets.enabled }}
                  name: {{ .Values.secrets.name }}
                  key: OIDC_CLIENT_SECRET
                  {{- else }}
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
                  {{- end }}
            {{- if .Values.s3.enabled }}
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.endpointKey }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretAccessKeyKey }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.s3.useSSL | quote }}
            {{- if .Values.auditExport.interval }}
            - name: AUDIT_EXPORT_INTERVAL
              value: {{ .Values.auditExport.interval | quote }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
