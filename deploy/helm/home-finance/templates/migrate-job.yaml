apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app: {{ .Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate-only"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if and .Values.postgres.cnpg.enabled (not .Values.externalSecrets.enabled) }}
                  name: {{ .Values.postgres.cnpg.clusterName }}-app
                  key: uri
                  {{- else }}
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
                  {{- end }}
            - name: ENV
              value: {{ (index .Values.env "ENV") | default "production" | quote }}
