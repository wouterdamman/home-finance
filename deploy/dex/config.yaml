# dex.localhost (not plain "localhost") so both the browser (host machine)
# and the containerized api service can reach Dex through the identical
# issuer hostname: *.localhost is RFC 6761 loopback on the host side, and
# it's a Docker network alias for the dex service on the container side.
issuer: http://dex.localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: home-finance
    secret: dev-secret
    name: Home Finance
    redirectURIs:
      - http://localhost:5173/auth/callback
      - http://localhost:8080/auth/callback

staticPasswords:
  - email: wouter@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8F4u"  # password
    username: wouter
    userID: wouter-id-001
  - email: ilse@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8F4u"  # password
    username: ilse
    userID: ilse-id-001

enablePasswordDB: true
