        "500":
          $ref: "#/components/responses/ServerError"

  /api/years:
    get:
      operationId: listYears
      tags: [Years]
      summary: Lists all known years, ascending.
      responses:
        "200":
          description: Years.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        "500":
          description: Server/DB error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createYear
      tags: [Years]
      summary: Registers a year (2000-2100), idempotent. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: integer
      responses:
        "201":
          description: Year registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: integer
        "400":
          description: Invalid body or year out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          description: Server/DB error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/years/{year}/summary:
    get:
      operationId: getYearSummary
      tags: [Years]
      summary: Full-year summary - all 12 months (income/expense/surplus), lock state, and pot balances.
      parameters:
        - $ref: "#/components/parameters/YearParam"
      responses:
        "200":
          description: Year summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearSummary"
        "400":
          description: Invalid year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/years/{year}/lock:
    post:
      operationId: lockYear
      tags: [Years]
      summary: Locks a year after a fresh Authentik re-authentication, once all its periods are closed. Admin only.
      parameters:
        - $ref: "#/components/parameters/YearParam"
      responses:
        "204":
          description: Year locked.
        "400":
          description: Invalid year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No fresh re-authentication on file; client should trigger the /auth/reauth popup and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Year already locked, or open periods still exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server/DB error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/years/{year}/unlock:
    post:
      operationId: unlockYear
      tags: [Years]
      summary: Unlocks a year after a fresh Authentik re-authentication. Admin only.
      parameters:
        - $ref: "#/components/parameters/YearParam"
      responses:
        "204":
          description: Year unlocked.
        "400":
          description: Invalid year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No fresh re-authentication on file; client should trigger the /auth/reauth popup and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Server/DB error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/export/years/{year}:
    get:
      operationId: exportYear
      tags: [Export]
      summary: Streams an .xlsx workbook for a year - one sheet per month, a year overview and pot balances. Admin only.
      parameters:
        - $ref: "#/components/parameters/YearParam"
        - name: months
          in: query
          description: Comma-separated month numbers (1-12). Omitted or empty means all twelve.
          schema:
            type: string
      responses:
        "200":
          description: Workbook, sent as an attachment named home-finance-{year}.xlsx.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid year, or an unparseable/out-of-range month in the months filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/import/xlsx:
    post:
      operationId: importXLSX
      tags: [Import]
      summary: Imports a budget workbook for one year. Admin only. wipe or resetMaster additionally require a fresh Authentik re-authentication. The whole import runs in one transaction and is rolled back on failure.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The .xlsx workbook. Max 20 MB.
                year:
                  type: integer
                  description: Target year, 2000-2100.
                wipe:
                  type: string
                  enum: ["true", "false"]
                  description: Delete the target year's periods before importing.
                resetMaster:
                  type: string
                  enum: ["true", "false"]
                  description: Also delete all periods of all years plus pots, categories and income sources first.
                closeThrough:
                  type: integer
                  description: Close imported periods up to and including this month. 0 means close none.
              required: [file, year]
      responses:
        "200":
          description: Import finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          description: "Malformed/oversized upload, missing file, invalid year, `parse_error` for an unreadable workbook, or `import_invalid` for a user-fixable spreadsheet problem (carries the offending month and row reference)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: "`import_error`: the import failed and was rolled back, so no data was changed; or `server_error` if the upload could not be buffered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set after successful login (OIDC or dev fake auth).
    csrfHeader:
      type: apiKey
      in: header
      name: X-Requested-With
      description: Required (value "XMLHttpRequest") on all mutating /api requests alongside the session cookie.

  parameters:
    PeriodId:
      name: id
      in: path
      required: true
      description: Period id.
      schema:
        type: integer
        format: int64
    EntityId:
      name: id
      in: path
      required: true
      description: Resource id.
      schema:
        type: integer
        format: int64
    YearParam:
      name: year
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Invalid request (code `bad_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated, or no fresh step-up re-authentication on file (code `unauthorized` / `reauth_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Admin role required, or the X-Requested-With CSRF header is missing (code `forbidden` / `csrf`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: JSON body exceeded the 1 MiB limit (code `body_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts (code `rate_limited`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Server or database error (code `db_error` / `server_error`); the message is generic.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]

    MeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
        avatarUrl:
          type: [string, "null"]
          description: Path to the avatar proxy, or null when no avatar is stored.
      required: [id, email, displayName, role]

    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 200
      required: [displayName]

    User:
      type: object
      description: Row from GET /api/users.
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, user]
        avatarUrl:
          type: string
      required: [id, email, displayName, role]

    UpdateUserRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, user]
      required: [role]

    Period:
      type: object
      description: Row from GET /api/periods.
      properties:
        id:
          type: integer
          format: int64
        year:
          type: integer
        month:
          type: integer
        status:
          type: string
          enum: [open, closed]
        closedAt:
          type: [string, "null"]
          format: date-time
        incomeTotalCents:
          type: integer
          format: int64
        expenseTotalCents:
          type: integer
          format: int64
        surplusCents:
          type: integer
          format: int64
      required: [id, year, month, status, incomeTotalCents, expenseTotalCents, surplusCents]

    PeriodBasic:
      type: object
      description: Response from POST /api/periods.
      properties:
        id:
          type: integer
          format: int64
        year:
          type: integer
        month:
          type: integer
        status:
          type: string
          enum: [open, closed]
      required: [id, year, month, status]

    CreatePeriodRequest:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        copyFromPeriodId:
          type: [integer, "null"]
          format: int64
          description: If omitted, the most recent prior period with data is auto-detected and copied from.
      required: [year, month]

    PeriodOverview:
      type: object
      description: Response from GET /api/periods/{id}/overview.
      properties:
        period:
          $ref: "#/components/schemas/PeriodOverviewPeriod"
        incomes:
          type: array
          items:
            $ref: "#/components/schemas/IncomeEntry"
        incomeTotalCents:
          type: integer
          format: int64
        budgetLines:
          type: array
          items:
            $ref: "#/components/schemas/BudgetLineWithTotals"
        expenseTotalCents:
          type: integer
          format: int64
        surplusCents:
          type: integer
          format: int64
        splits:
          type: array
          items:
            $ref: "#/components/schemas/PotSplit"
        splitPercentageTotal:
          type: string
          description: Decimal string, e.g. "100.00".
      required:
        - period
        - incomes
        - incomeTotalCents
        - budgetLines
        - expenseTotalCents
        - surplusCents
        - splits
        - splitPercentageTotal

    PeriodOverviewPeriod:
      type: object
      properties:
        id:
          type: integer
          format: int64
        year:
          type: integer
        month:
          type: integer
        status:
          type: string
          enum: [open, closed]
        closedAt:
          type: [string, "null"]
          format: date-time
      required: [id, year, month, status]

    IncomeEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        periodId:
          type: integer
          format: int64
        sourceId:
          type: [integer, "null"]
          format: int64
        label:
          type: [string, "null"]
        amountCents:
          type: integer
          format: int64
        entryType:
          type: string
          enum: [normal, carryover]
        notes:
          type: string
        sortOrder:
          type: integer
      required: [id, amountCents, entryType, notes, sortOrder]

    CreateIncomeEntryRequest:
      type: object
      properties:
        sourceId:
          type: [integer, "null"]
          format: int64
        label:
          type: [string, "null"]
        amountCents:
          type: integer
          format: int64
        notes:
          type: string
        sortOrder:
          type: integer
      required: [amountCents]

    UpdateIncomeEntryRequest:
      type: object
      properties:
        label:
          type: [string, "null"]
        amountCents:
          type: integer
          format: int64
        notes:
          type: string
        sortOrder:
          type: integer
      required: [amountCents]

    BudgetLine:
      type: object
      properties:
        id:
          type: integer
          format: int64
        periodId:
          type: integer
          format: int64
        categoryId:
          type: [integer, "null"]
          format: int64
        label:
          type: [string, "null"]
        amountCents:
          type: integer
          format: int64
        tracksTransactions:
          type: boolean
        sortOrder:
          type: integer
      required: [id, periodId, amountCents, tracksTransactions, sortOrder]

    BudgetLineWithTotals:
      description: Budget line as returned within a period overview, including derived transaction/effective totals.
      allOf:
        - type: object
          properties:
            id:
              type: integer
              format: int64
            categoryId:
              type: [integer, "null"]
              format: int64
            label:
              type: [string, "null"]
            amountCents:
              type: integer
              format: int64
            tracksTransactions:
              type: boolean
            transactionsTotalCents:
              type: integer
              format: int64
            effectiveCents:
              type: integer
              format: int64
              description: transactionsTotalCents if tracksTransactions, otherwise amountCents.
            sortOrder:
              type: integer
          required:
            - id
            - amountCents
            - tracksTransactions
            - transactionsTotalCents
