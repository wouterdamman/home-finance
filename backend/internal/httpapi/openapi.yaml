          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/kids/{id}/ledger:
    get:
      operationId: getKidLedger
      tags: [Kids]
      summary: Lists a kid's savings ledger in date order, with running ours/theirs balances.
      parameters:
