              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/kid-entries/{id}:
    patch:
      operationId: updateKidLedgerEntry
      tags: [Kids]
      summary: Updates a kid ledger entry's owner and amount. Withdrawal amounts are coerced negative.
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKidLedgerEntryRequest"
      responses:
        "200":
          description: Entry updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KidEntryUpdated"
        "400":
          description: Invalid id, owner, or amount out of range.
          content:
