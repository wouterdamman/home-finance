            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Entry not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`year_locked`: the entry's calendar year is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
